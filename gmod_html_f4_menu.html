
<!DOCTYPE html>

    <!-- FontAwesome Icons -->

    <style>
        /* Убираем белую focus-обводку у кнопок/полей */
        * { outline: none !important; -webkit-tap-highlight-color: transparent; }
        button::-moz-focus-inner { border: 0; }
        button:focus, button:focus-visible { outline: none !important; }

        :root {
            --accent-color: #00f2fe;
            --accent-secondary: #00c6ff;
            --accent-glow: rgba(0, 242, 254, 0.3);
            --accent-border: rgba(0, 242, 254, 0.5);
            --accent-bg: rgba(0, 242, 254, 0.18);
        }

        /* Custom scrollbars */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.4); }
        ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-secondary); }

        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

        /* Liquid Glass 27 Styling */
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 100%) !important;
            backdrop-filter: blur(28px) saturate(210%) !important;
            -webkit-backdrop-filter: blur(28px) saturate(210%) !important;
            border: 1px solid rgba(255, 255, 255, 0.22) !important;
            box-shadow: 
                0 16px 40px 0 rgba(0, 0, 0, 0.65), 
                inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.5),
                inset 0 -1px 2px 0 rgba(0, 0, 0, 0.4),
                0 0 25px var(--accent-glow) !important;
        }

        .liquid-glass-sub {
            background: rgba(20, 26, 38, 0.65) !important;
            backdrop-filter: blur(16px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(16px) saturate(180%) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 1rem !important;
            clip-path: inset(0 round 1rem) !important;
        }

        .liquid-shine {
            position: relative;
            overflow: hidden;
        }
        .liquid-shine::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: skewX(-25deg);
            animation: liquidGlare 6s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes liquidGlare {
            0% { left: -100%; }
            30% { left: 200%; }
            100% { left: 200%; }
        }

        .scanlines {
            background: linear-gradient(
                to bottom,
                rgba(255,255,255,0),
                rgba(255,255,255,0) 50%,
                rgba(0, 0, 0, 0.25) 50%,
                rgba(0, 0, 0, 0.25)
            );
            background-size: 100% 4px;
        }

        .theme-active-tab {
            background: linear-gradient(90deg, var(--accent-bg), rgba(255, 255, 255, 0.05)) !important;
            border-color: var(--accent-border) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 15px var(--accent-glow) !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans h-screen flex items-center justify-center overflow-hidden select-none relative" style="background: radial-gradient(circle at 15% 20%, rgba(0,242,254,0.28) 0%, rgba(0,0,0,0) 45%), radial-gradient(circle at 85% 75%, rgba(168,85,247,0.30) 0%, rgba(0,0,0,0) 50%), radial-gradient(circle at 55% 45%, rgba(59,130,246,0.22) 0%, rgba(0,0,0,0) 55%), linear-gradient(135deg, #08121f 0%, #020617 55%, #0a1120 100%); background-size: cover;">

                    </div>
                </div>

    </main>

                const isFull = job.slots !== '∞' && job.count !== undefined && job.count >= parseInt(job.slots);
                const isDisabled = job.disabled === true;
                const card = document.createElement('div');
                card.className = isDisabled
                    ? 'liquid-glass-sub p-3 rounded-2xl flex items-center justify-between border border-rose-900/40 opacity-40 grayscale gap-3 select-none pointer-events-none'

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(t => { t.classList.add('hidden'); t.classList.remove('flex'); });
            document.querySelectorAll('.nav-tab-btn').forEach(b => { b.className = 'nav-tab-btn w-full px-4 py-3 rounded-xl flex items-center justify-between text-xs font-bold transition liquid-glass-sub text-slate-300 hover:text-white hover:bg-white/10'; });
            const tab = document.getElementById('tab-' + tabId);
            if (tab) { tab.classList.remove('hidden'); tab.classList.add('flex'); }
            if (btn) btn.className = 'nav-tab-btn w-full px-4 py-3 rounded-xl flex items-center justify-between text-xs font-bold transition theme-active-tab border';
        }

        function filterJobs(cat, btn) {
            currentJobCategory = cat;
            document.querySelectorAll('.job-filter-btn').forEach(b => { b.className = 'job-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold transition liquid-glass-sub text-slate-300 hover:text-white shrink-0'; });
            if (btn) btn.className = 'job-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold transition bg-cyan-400 text-slate-950 shrink-0';
            renderJobs(cat, document.getElementById('jobSearch').value);
        }
        function searchJobs() { renderJobs(currentJobCategory, document.getElementById('jobSearch').value); }

        function filterShop(cat, btn) {
            currentShopCategory = cat;
            document.querySelectorAll('.shop-filter-btn').forEach(b => { b.className = 'shop-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold transition liquid-glass-sub text-slate-300 hover:text-white shrink-0'; });
            if (btn) btn.className = 'shop-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold transition bg-emerald-400 text-slate-950 shrink-0';
            renderShop(cat, document.getElementById('shopSearch').value);
        }
        function searchShop() { renderShop(currentShopCategory, document.getElementById('shopSearch').value); }

        function filterDonate(cat, btn) {
            currentDonateCategory = cat;
            document.querySelectorAll('.donate-filter-btn').forEach(b => { b.className = 'donate-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold transition liquid-glass-sub text-slate-300 hover:text-white shrink-0'; });
            if (btn) btn.className = 'donate-filter-btn px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-400 text-slate-950 shrink-0';
            renderDonate(cat);
        }

        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'liquid-glass px-4 py-2.5 rounded-xl text-xs font-bold text-white shadow-xl border border-cyan-400/40 flex items-center gap-2';
            toast.innerHTML = '<i class="fa-solid fa-circle-info text-cyan-400"></i> <span>' + msg + '</span>';
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        function closeMenu() { if (window.gmod && window.gmod.closeF4Menu) window.gmod.closeF4Menu(); }
        function openRules() {
            showToast('Правила сервера доступны в Discord / на вкладке при включении сайта правил.');
        }

        function initHorizontalMouseWheel() {
            document.querySelectorAll('.overflow-x-auto').forEach(container => {
                container.addEventListener('wheel', (e) => {
                    if (e.deltaY !== 0) { e.preventDefault(); container.scrollLeft += e.deltaY * 0.8; }
                }, { passive: false });
            });
        }

        window.onload = function() {
            renderJobs('civilian');
            renderShop('printers');
            renderDonate('privileges');
            initHorizontalMouseWheel();
        };
    </script>
</body>
</html>
